name: Build Windows Release Asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        shell: powershell
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows app
        shell: powershell
        run: |
          pyinstaller --clean -y VinylFlow.spec

      - name: Package portable ZIP
        shell: powershell
        run: |
          if (Test-Path VinylFlow-windows-unsigned.zip) { Remove-Item VinylFlow-windows-unsigned.zip -Force }
          Compress-Archive -Path dist\VinylFlow\* -DestinationPath VinylFlow-windows-unsigned.zip
          Get-Item VinylFlow-windows-unsigned.zip | Format-List Name,Length,LastWriteTime

      - name: Build installer with Inno Setup
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VinylFlow.iss
          Get-Item dist\VinylFlow-Setup-*.exe | Format-List Name,Length,LastWriteTime

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          gh release upload ${{ inputs.tag }} VinylFlow-windows-unsigned.zip --clobber
          $installer = Get-Item dist\VinylFlow-Setup-*.exe
          gh release upload ${{ inputs.tag }} $installer.FullName --clobber
          $release = gh release view ${{ inputs.tag }} --json assets | ConvertFrom-Json
          $release.assets | Select-Object name,size,updatedAt | Format-Table
